name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Nom en minuscules : les registres Docker refusent les majuscules,
  # or le compte GitHub s'écrit "JP-maker".
  IMAGE_NAME: ghcr.io/jp-maker/gamegauge-api

jobs:
  # ---------------------------------------------------------------
  # 1. Build + tests : s'exécute sur chaque push et pull request
  #    Une base MySQL éphémère est démarrée pour le test de
  #    chargement du contexte Spring (@SpringBootTest).
  # ---------------------------------------------------------------
  build-and-test:
    name: Build & tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: gamegauge_db
          MYSQL_USER: gamegauge
          MYSQL_PASSWORD: gamegauge_ci
          MYSQL_ROOT_PASSWORD: root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Valeurs factices UNIQUEMENT pour la CI (jamais utilisées en production)
      USER_NAME_DB: gamegauge
      USER_PASS_DB: gamegauge_ci
      JWT_SECRET_KEY: Z2FtZWdhdWdlLWNpLW9ubHktand0LXNlY3JldC1rZXktbm90LWZvci1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=
      RECAPTCHA_SECRET_KEY: ci-dummy-key
      SPRING_MAIL_HOST: localhost
      SPRING_MAIL_PORT: 3025
      SPRING_MAIL_USERNAME: ci@gamegauge.fr
      SPRING_MAIL_PASSWORD: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Le fichier mvnw est versionné sans le bit exécutable :
      # sans ce chmod, le runner renvoie "Permission denied".
      - name: Rendre le wrapper Maven exécutable
        run: chmod +x ./mvnw

      - name: Build + tests Maven
        run: ./mvnw -B verify

  # ---------------------------------------------------------------
  # 2. Image Docker : uniquement sur push vers main
  # ---------------------------------------------------------------
  docker:
    name: Image Docker → GHCR
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées de l'image (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build & push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 3. Déploiement sur le VPS : après la publication de l'image
  # ---------------------------------------------------------------
  deploy:
    name: Déploiement VPS
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Mettre à jour le conteneur via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ secrets.VPS_APP_DIR }}
            docker compose pull backend
            docker compose up -d backend
            docker image prune -f
